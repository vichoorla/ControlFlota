<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f5f5f5; 
            margin: 0; 
            padding: 20px; 
        }

        .login-container { 
            max-width: 400px; 
            margin: 100px auto; 
            padding: 20px; 
            background: white; 
            border-radius: 5px; 
            box-shadow: 0 0 10px rgba(0,0,0,0.1); 
        }

        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 20px;
        }

        .form-group { 
            margin-bottom: 15px; 
        }

        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: bold; 
            color: #555;
        }

        input[type="text"], 
        input[type="password"] { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #ddd; 
            border-radius: 4px; 
            box-sizing: border-box; 
            font-size: 14px;
        }

        input[type="text"]:focus, 
        input[type="password"]:focus { 
            border-color: #4CAF50; 
            outline: none; 
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }

        button { 
            width: 100%; 
            background-color: #4CAF50; 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: background-color 0.3s;
        }

        button:hover { 
            background-color: #45a049; 
        }

        .error { 
            color: red; 
            text-align: center; 
            margin-bottom: 15px; 
            padding: 10px;
            background-color: #ffe6e6;
            border: 1px solid #ffcccc;
            border-radius: 4px;
        }

        .success { 
            color: green; 
            text-align: center; 
            margin-bottom: 15px; 
            padding: 10px;
            background-color: #e6ffe6;
            border: 1px solid #ccffcc;
            border-radius: 4px;
        }

        .user-info { 
            background-color: #e7f3fe; 
            padding: 15px; 
            border-radius: 4px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>🚗 Sistema de Gestión de Flota</h2>
        <h3>Iniciar Sesión</h3>

        {% if messages %}
            {% for message in messages %}
                <div class="{% if message.tags == 'error' %}error{% else %}success{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <!-- ✅ CSRF TOKEN AGREGADO AQUÍ -->
        <form method="post">
            {% csrf_token %}  <!-- ESTA LÍNEA ES CLAVE -->
            
            <div class="form-group">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit">🔐 Ingresar al Sistema</button>
        </form>

    </div>
</body>
</html>
