{% extends 'TemplatesFlota/base.html' %}

{% block title %}Agregar Mecánico{% endblock %}

{% block menu %}
    <a href="{% url 'admin_dashboard' %}">Volver al Panel</a>
{% endblock %}

{% block content %}
<h2>Agregar Mecánico</h2>
<form method="post">
    {% csrf_token %}

    <h3>Datos de Usuario (Para Iniciar Sesión)</h3>
    <div class="form-group">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" required>
    </div>
    <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
    </div>
    <div class="form-group">
        <label for="email_usuario">Email (Usuario):</label>
        <input type="email" id="email_usuario" name="email_usuario" required>
    </div>

    <hr>

    <h3>Datos del Perfil Mecánico</h3>
    <div class="form-group">
        <label for="RUT_Mecanico">RUT Mecánico:</label>
        <input type="text" id="RUT_Mecanico" name="RUT_Mecanico" required>
    </div>
    
    <div class="form-group">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
    </div>
    
    <div class="form-group">
        <label for="fecha_nacimiento">Fecha de Nacimiento:</label>
        <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
    </div>
    
    <div class="form-group">
        <label for="telefono">Teléfono:</label>
        <input type="text" id="telefono" name="telefono" required>
    </div>
    
    <div class="form-group">
        <label for="estado">Estado:</label>
        <select id="estado" name="estado" required>
            <option value="Activo">Activo</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Vacaciones">Vacaciones</option>
            <option value="Licencia">Licencia</option>
        </select>
    </div>

    <div class="form-group">
        <label for="taller">Taller:</label>
        <input type="text" id="taller" name="taller" required>
    </div>
    
    <div class="form-group">
        <label for="horas">Horas:</label>
        <input type="number" id="horas" name="horas" required>
    </div>
    
    <input type="submit" value="Agregar Mecánico">
</form>
{% endblock %}
