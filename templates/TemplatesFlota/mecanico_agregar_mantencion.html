{% extends 'TemplatesFlota/base.html' %}

{% block title %}Agregar Mantención{% endblock %}

{% block menu %}
    <a href="{% url 'mecanico_dashboard' %}">Volver al Panel</a>
    <a href="{% url 'mecanico_ver_mantenciones' %}">Ver Mantenciones</a>
{% endblock %}

{% block content %}
<h2>Agregar Registro de Mantención</h2>
<form method="post">
    {% csrf_token %}

    <div class="form-group">
        <label for="vehiculo">Vehículo:</label>
        <select id="vehiculo" name="vehiculo" required>
            <option value="" disabled selected>Seleccione un vehículo</option>
            {% for v in todos_los_vehiculos %}
                <option value="{{ v.patente }}">{{ v.patente }} - {{ v.marca }} {{ v.modelo }}</option>
            {% endfor %}
        </select>
    </div>
    
    <div class="form-group">
        <label for="tipo_mantencion">Tipo de Mantención:</label>
        <select id="tipo_mantencion" name="tipo_mantencion" required>
            <option value="Preventiva">Preventiva</option>
            <option value="Correctiva">Correctiva</option>
            <option value="Predictiva">Predictiva</option>
            <option value="Programada">Programada</option>
        </select>
    </div>

    <div class="form-group">
        <label for="fecha">Fecha:</label>
        <input type="date" id="fecha" name="fecha" required>
    </div>

    <div class="form-group">
        <label for="lugar">Lugar:</label>
        <input type="text" id="lugar" name="lugar" required>
    </div>

    <div class="form-group">
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion" rows="4" required></textarea>
    </div>

    <input type="submit" value="Agregar Mantención">
</form>
{% endblock %}
