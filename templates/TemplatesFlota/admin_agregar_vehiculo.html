{% extends 'TemplatesFlota/base.html' %}

{% block title %}Agregar Vehículo{% endblock %}

{% block menu %}
    <a href="{% url 'admin_dashboard' %}">Volver al Panel</a>
{% endblock %}

{% block content %}
<h2>Agregar Vehículo</h2>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        <label for="patente">Patente:</label>
        <input type="text" id="patente" name="patente" required>
    </div>
    
    <div class="form-group">
        <label for="vin">VIN:</label>
        <input type="text" id="vin" name="vin" required maxlength="17">
    </div>
    
    <div class="form-group">
        <label for="marca">Marca:</label>
        <input type="text" id="marca" name="marca" required>
    </div>
    
    <div class="form-group">
        <label for="modelo">Modelo:</label>
        <input type="text" id="modelo" name="modelo" required>
    </div>
    
    <div class="form-group">
        <label for="año">Año:</label>
        <input type="number" id="año" name="año" required>
    </div>
    
    <div class="form-group">
        <label for="motor">Motor:</label>
        <input type="text" id="motor" name="motor" required>
    </div>

    <div class="form-group">
        <label for="tipo">Tipo de Vehículo:</label>
        <select id="tipo" name="tipo" required>
            <option value="" disabled selected>Seleccione un tipo</option>
            {% for tipo in tipos_vehiculo %}
                <option value="{{ tipo.ID_Tipo }}">{{ tipo.nombre }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="chofer_asignado">Chofer Asignado:</label>
        <select id="chofer_asignado" name="chofer_asignado">
            <option value="">Sin Asignar</option> {% for chofer in choferes %}
                <option value="{{ chofer.usuario.id }}">{{ chofer.Nombre }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="kilometraje">Kilometraje:</label>
        <input type="number" id="kilometraje" name="kilometraje" value="0" required>
    </div>
    
    <div class="form-group">
        <label for="estanque">Capacidad Estanque (Lts):</label>
        <input type="number" step="0.01" id="estanque" name="estanque" required>
    </div>

    <div class="form-group">
        <label for="tonelaje">Tonelaje (Opcional):</label>
        <input type="number" step="0.01" id="tonelaje" name="tonelaje">
    </div>

    <div class="form-group">
        <label for="seguro">Seguro Vigente:</label>
        <input type="checkbox" id="seguro" name="seguro" checked>
    </div>
    
    <div class="form-group">
        <label for="revision_tecnica">Revisión Técnica Vigente:</label>
        <input type="checkbox" id="revision_tecnica" name="revision_tecnica" checked>
    </div>
    
    <div class="form-group">
        <label for="permiso_circulacion">Permiso de Circulación Vigente:</label>
        <input type="checkbox" id="permiso_circulacion" name="permiso_circulacion" checked>
    </div>
    
    <div class="form-group">
        <label for="gps">GPS Activo:</label>
        <input type="checkbox" id="gps" name="gps" checked>
    </div>
    
    <input type="submit" value="Agregar Vehículo">
</form>
{% endblock %}
