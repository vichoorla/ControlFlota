{% extends 'TemplatesFlota/base.html' %}
{% load static %}

{% block title %}Panel de Chofer{% endblock %}

{% block content %}
<h2>Panel de Chofer</h2>

<div class="card-panel" style="display: flex; align-items: center; gap: 20px;">
    <img src="{% static 'images/fotoperfil.jpg' %}" alt="Foto de perfil" style="width: 80px; height: 80px; border-radius: 50%;">
    <div>
        <h5>Bienvenido, {{ nombre_usuario }}</h5>
        <p style="color: #555;">Rol: Chofer</p>
    </div>
</div>

<div class="row">
    <div class="col s12 m6">
        <div class="card-panel blue lighten-4">
            <span class="blue-text text-darken-2">
                Aquí puedes poner información rápida, como tu vehículo asignado.
            </span>
        </div>
    </div>
</div>
{% endblock %}
